<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiolenbox __VER__</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#f7f8fb,#e6e9f0);font:14px system-ui,sans-serif;color:#2b2f38}
#ui{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);padding:10px 12px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#ui h1{font-size:15px;margin:0 0 6px} #ui .m{color:#667;font-size:12.5px;margin-bottom:8px}
button{font:inherit;border:1px solid #c9cfdb;background:#fff;border-radius:7px;padding:5px 10px;margin:2px 4px 2px 0;cursor:pointer}
button.on{background:#2f6fe4;color:#fff;border-color:#2f6fe4}
#hint{position:absolute;bottom:10px;left:10px;font-size:12px;color:#778}
</style></head><body>
<div id="ui"><h1>Fiolenbox __VER__ · __RASTER__</h1>
<div class="m">__MASSE__</div>
<button id="bLid">Deckel ab</button><button id="bCut">Schnitt</button><button id="bVial" class="on">Fiolen</button><button id="bPrint">Drucklage</button>
</div>
<div id="hint">Drehen: ziehen · Zoom: scrollen · Deckel direkt anfassen und hoch-/runterziehen</div>
<script>__THREE__</script>
<script>
const INFO = __INFO__;
const STL_BASE = "__STL_BASE__", STL_LID = "__STL_LID__";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 1, 2000);
const K = Math.max(1, Math.max(INFO.L, INFO.W)/82);
cam.up.set(0,0,1); cam.position.set(150*K,-170*K,130*K);
const ren = new THREE.WebGLRenderer({antialias:true, alpha:true});
ren.setPixelRatio(devicePixelRatio); ren.setSize(innerWidth, innerHeight); ren.localClippingEnabled = true;
document.body.appendChild(ren.domElement);
const ctl = new OrbitControls(cam, ren.domElement); ctl.target.set(0,0,INFO.H/2); ctl.enableDamping = true; ctl.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(80,-120,200); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, .6); dl2.position.set(-100,80,50); scene.add(dl2);
const clip = new THREE.Plane(new THREE.Vector3(-1,0,0), INFO.cut_x || 0);   // Schnitt quer durch Rastnasen
const clips = [];
const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:.55, metalness:0, side:THREE.FrontSide, clippingPlanes:clips});
const L = new STLLoader();
const base = new THREE.Mesh(L.parse(b64(STL_BASE)), mat(0x4f8fd6));
const lid = new THREE.Mesh(L.parse(b64(STL_LID)), mat(0xf0a24a));
const root = new THREE.Group(); scene.add(root); root.add(base); root.add(lid);
// Schnittflächen-Imitat: Rückseiten dunkel einfärben
const cap = c => new THREE.MeshBasicMaterial({color:c, side:THREE.BackSide, clippingPlanes:clips});
base.add(new THREE.Mesh(base.geometry, cap(0x1f3f66))); lid.add(new THREE.Mesh(lid.geometry, cap(0x8a5418)));
const vials = new THREE.Group(); root.add(vials);
const vg = new THREE.CylinderGeometry(INFO.vial_d/2, INFO.vial_d/2, INFO.vial_h, 40); vg.rotateX(Math.PI/2);
const vm = new THREE.MeshStandardMaterial({color:0xcfe8f7, transparent:true, opacity:.55, roughness:.1, clippingPlanes:clips});
const capm = new THREE.MeshStandardMaterial({color:0x8a8f99, roughness:.4, clippingPlanes:clips});
for (const [x,y] of INFO.pts){
  const v = new THREE.Mesh(vg, vm); v.position.set(x,y,INFO.floor+INFO.vial_h/2); vials.add(v);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(INFO.vial_d/2+.3, INFO.vial_d/2+.3, 7, 40).rotateX(Math.PI/2), capm);
  c.position.set(x,y,INFO.floor+INFO.vial_h-3.5); vials.add(c);
}
// Deckel-Hub
let lift = 0, target = 0, printMode = false;
const LMAX = 45;
function setLift(v){ lift = Math.max(0, Math.min(LMAX, v)); lid.position.z = lift; }
const bLid = document.getElementById('bLid');
bLid.onclick = () => { target = lift > 5 ? 0 : 30; };
const bCut = document.getElementById('bCut');
bCut.onclick = () => { if (clips.length) clips.pop(); else clips.push(clip); bCut.classList.toggle('on', !!clips.length);
  if (clips.length) { cam.position.set((INFO.cut_x||0)+140*K, 0, 30*K); ctl.target.set(INFO.cut_x||0,0,INFO.H/2); } };
const bVial = document.getElementById('bVial');
bVial.onclick = () => { vials.visible = !vials.visible; bVial.classList.toggle('on', vials.visible); };
const bPrint = document.getElementById('bPrint');
bPrint.onclick = () => { printMode = !printMode; bPrint.classList.toggle('on', printMode);
  if (printMode){ vials.visible = false; bVial.classList.remove('on'); target = lift = 0;
    lid.rotation.x = Math.PI; lid.position.set(0, -(INFO.W+15), INFO.H); cam.position.set(170*K,-230*K,150*K); ctl.target.set(0,-(INFO.W+15)/2,12); }
  else { lid.rotation.x = 0; lid.position.set(0,0,0); } };
// Deckel direkt ziehen
const ray = new THREE.Raycaster(), mp = new THREE.Vector2(); let drag = null;
ren.domElement.addEventListener('pointerdown', e => {
  if (printMode) return;
  mp.set(e.clientX/innerWidth*2-1, -e.clientY/innerHeight*2+1); ray.setFromCamera(mp, cam);
  if (ray.intersectObject(lid).length){ drag = {y:e.clientY, l:lift}; ctl.enabled = false; target = null; ren.domElement.setPointerCapture(e.pointerId); }
});
ren.domElement.addEventListener('pointermove', e => { if (drag) setLift(drag.l + (drag.y - e.clientY) * 0.25); });
ren.domElement.addEventListener('pointerup', () => { if (drag){ drag = null; ctl.enabled = true; target = lift < 4 ? 0 : null; } });
addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
(function loop(){ requestAnimationFrame(loop);
  if (target !== null && !printMode){ const d = target - lift; if (Math.abs(d) > .05) setLift(lift + d*.15); else { setLift(target); } }
  bLid.textContent = lift > 5 ? 'Deckel drauf' : 'Deckel ab';
  ctl.update(); ren.render(scene, cam); })();
</script></body></html>
